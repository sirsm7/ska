<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pendaftaran - Kehadiran Anugerah</title>
    <link rel="icon" type="image/png" href="icoppdag.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .loader {
            border-top-color: #3b82f6;
            -webkit-animation: spinner 1.5s linear infinite;
            animation: spinner 1.5s linear infinite;
        }
        @keyframes spinner {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800">

    <!-- Navbar -->
    <nav class="bg-blue-600 text-white shadow-md">
        <div class="max-w-4xl mx-auto px-4 flex justify-between items-center h-16">
            <div class="flex items-center gap-3">
                <img src="icoppdag.png" alt="Logo" class="h-10 w-auto bg-white rounded p-1 object-contain" onerror="this.style.display='none'">
                <h1 class="text-xl font-bold tracking-tight">Pendaftaran Kehadiran</h1>
            </div>
            <div class="flex space-x-4 text-sm sm:text-base font-medium">
                <a href="index.html" class="font-semibold underline underline-offset-4">Carian</a>
                <a href="semakan.html" class="hover:text-blue-200 transition-colors">Semakan</a>
                <a href="admin.html" class="hover:text-blue-200 transition-colors">Admin</a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-4xl mx-auto px-4 py-8">
        
        <!-- Search Bar Area -->
        <div class="bg-white p-6 rounded-lg shadow-md mb-8">
            <label for="searchInput" class="block text-gray-700 text-lg font-bold mb-2">Carian Pantas</label>
            <p class="text-sm text-gray-500 mb-4">Cari mengikut No. Bil, Nama, atau Nama Sekolah.</p>
            <div class="flex">
                <input type="text" id="searchInput" 
                    class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 text-lg" 
                    placeholder="Mula menaip... (Contoh: 25, Ahmad, SK Seri Melaka)"
                    autocomplete="off">
            </div>
        </div>

        <!-- Loading Indicator -->
        <div id="loadingIndicator" class="hidden flex justify-center py-8">
            <div class="loader ease-linear rounded-full border-4 border-t-4 border-gray-200 h-12 w-12 mb-4"></div>
        </div>

        <!-- Error Message -->
        <div id="errorMessage" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-4" role="alert">
            <span class="block sm:inline" id="errorText">Ralat berlaku.</span>
        </div>

        <!-- Results Area -->
        <div id="resultsContainer">
            <!-- Results will be dynamically inserted here -->
        </div>

    </main>

    <!-- Modal Wakil -->
    <div id="wakilModal" class="hidden fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full z-50">
        <div class="relative top-20 mx-auto p-5 border w-96 shadow-lg rounded-md bg-white">
            <div class="mt-3 text-center">
                <h3 class="text-lg leading-6 font-medium text-gray-900" id="modalTitle">Daftar Wakil</h3>
                <div class="mt-2 px-7 py-3">
                    <p class="text-sm text-gray-500 mb-2">Penerima asal: <span id="modalRecipientName" class="font-bold text-gray-800"></span></p>
                    <input type="hidden" id="modalRecipientId">
                    <input type="hidden" id="modalRecipientSekolah">
                    <input type="text" id="wakilNameInput" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-purple-500" placeholder="Masukkan nama penuh wakil" required>
                </div>
                <div class="items-center px-4 py-3 flex justify-between gap-2">
                    <button id="cancelWakilBtn" class="px-4 py-2 bg-gray-200 text-gray-800 text-base font-medium rounded-md w-full shadow-sm hover:bg-gray-300 focus:outline-none focus:ring-2 focus:ring-gray-300">
                        Batal
                    </button>
                    <button id="saveWakilBtn" class="px-4 py-2 bg-purple-600 text-white text-base font-medium rounded-md w-full shadow-sm hover:bg-purple-700 focus:outline-none focus:ring-2 focus:ring-purple-500">
                        Simpan
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Supabase Initialization
        const SUPABASE_URL = 'https://app.tech4ag.my';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIiwiaWF0IjoxNzYzMzczNjQ1LCJleHAiOjIwNzg3MzM2NDV9.vZOedqJzUn01PjwfaQp7VvRzSm4aRMr21QblPDK8AoY';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // DOM Elements
        const searchInput = document.getElementById('searchInput');
        const resultsContainer = document.getElementById('resultsContainer');
        const loadingIndicator = document.getElementById('loadingIndicator');
        const errorMessage = document.getElementById('errorMessage');
        const errorText = document.getElementById('errorText');

        // Modal Elements
        const wakilModal = document.getElementById('wakilModal');
        const modalRecipientName = document.getElementById('modalRecipientName');
        const modalRecipientId = document.getElementById('modalRecipientId');
        const modalRecipientSekolah = document.getElementById('modalRecipientSekolah');
        const wakilNameInput = document.getElementById('wakilNameInput');
        const cancelWakilBtn = document.getElementById('cancelWakilBtn');
        const saveWakilBtn = document.getElementById('saveWakilBtn');

        // Event Listeners
        // Gunakan debouncing untuk mengurangkan beban pelayan semasa carian live
        let typingTimer;
        const doneTypingInterval = 300; // 300 milisaat masa menunggu

        searchInput.addEventListener('input', function () {
            clearTimeout(typingTimer);
            if (searchInput.value) {
                typingTimer = setTimeout(performSearch, doneTypingInterval);
            } else {
                // Kosongkan hasil jika kotak carian kosong
                resultsContainer.innerHTML = '';
            }
        });
        
        cancelWakilBtn.addEventListener('click', closeWakilModal);
        saveWakilBtn.addEventListener('click', saveWakil);

        // Helper: Format Time
        function formatTime(dateString) {
            if (!dateString) return '';
            const date = new Date(dateString);
            return date.toLocaleTimeString('en-MY', { hour: 'numeric', minute: '2-digit', hour12: true });
        }

        // Display Error
        function showError(msg) {
            errorText.textContent = msg;
            errorMessage.classList.remove('hidden');
            setTimeout(() => errorMessage.classList.add('hidden'), 5000);
        }

        // Perform Search
        async function performSearch() {
            const query = searchInput.value.trim();
            if (!query) {
                resultsContainer.innerHTML = '';
                return;
            }

            loadingIndicator.classList.remove('hidden');
            resultsContainer.innerHTML = '';
            errorMessage.classList.add('hidden');

            try {
                let { data: recipients, error } = await supabaseClient
                    .from('recipients')
                    .select('*')
                    .or(`bil.eq.${isNaN(parseInt(query)) ? -1 : parseInt(query)},nama.ilike.%${query}%,sekolah.ilike.%${query}%`)
                    .order('sekolah', { ascending: true })
                    .order('bil', { ascending: true });

                if (error) throw error;

                renderResults(recipients, query);

            } catch (error) {
                console.error("Carian Ralat:", error);
                showError("Gagal melaksanakan carian. Sila cuba lagi.");
            } finally {
                loadingIndicator.classList.add('hidden');
            }
        }

        // Render Results
        function renderResults(recipients, query) {
            if (!recipients || recipients.length === 0) {
                resultsContainer.innerHTML = `
                    <div class="bg-yellow-50 border-l-4 border-yellow-400 p-4">
                        <div class="flex">
                            <div class="ml-3">
                                <p class="text-sm text-yellow-700">Tiada rekod dijumpai untuk pencarian: "${query}"</p>
                            </div>
                        </div>
                    </div>`;
                return;
            }

            // Group by School
            const groupedBySchool = recipients.reduce((acc, recipient) => {
                if (!acc[recipient.sekolah]) {
                    acc[recipient.sekolah] = [];
                }
                acc[recipient.sekolah].push(recipient);
                return acc;
            }, {});

            let html = '';

            for (const [sekolah, students] of Object.entries(groupedBySchool)) {
                html += `
                    <div class="mb-8">
                        <h2 class="text-xl font-bold bg-gray-200 px-4 py-2 rounded-t-lg border-b border-gray-300 text-gray-800 uppercase tracking-wide">
                            ${sekolah}
                        </h2>
                        <div class="bg-white shadow rounded-b-lg overflow-hidden">
                `;

                students.forEach((student, index) => {
                    const isLast = index === students.length - 1;
                    const borderClass = isLast ? '' : 'border-b border-gray-200';
                    
                    let statusHtml = '';
                    let actionHtml = '';

                    if (student.attendance_status === 'HADIR') {
                        statusHtml = `<div class="text-green-600 font-bold flex items-center"><span class="mr-1">🟢</span> Hadir ${formatTime(student.attendance_time)}</div>`;
                        if(student.attendance_type === 'WAKIL') {
                             statusHtml = `
                             <div class="text-purple-600 font-bold flex items-center mb-1"><span class="mr-1">🟣</span> Wakil Hadir ${formatTime(student.attendance_time)}</div>
                             <div class="text-sm text-gray-600">Diwakili oleh: ${student.representative_name}</div>
                             `;
                        }
                    } else if (student.attendance_status === 'TIDAK HADIR') {
                        statusHtml = `<div class="text-red-600 font-bold flex items-center"><span class="mr-1">🔴</span> Tidak Hadir</div>`;
                        actionHtml = generateActionButtons(student.id, student.nama, student.sekolah);
                    } else {
                        statusHtml = `<div class="text-yellow-600 font-bold flex items-center"><span class="mr-1">🟡</span> Belum Hadir</div>`;
                        actionHtml = generateActionButtons(student.id, student.nama, student.sekolah);
                    }

                    html += `
                        <div class="p-4 ${borderClass} flex flex-col sm:flex-row justify-between items-start sm:items-center hover:bg-gray-50 transition duration-150">
                            <div class="mb-4 sm:mb-0 w-full sm:w-2/3">
                                <div class="flex items-baseline">
                                    <span class="text-gray-500 font-mono text-sm mr-3">Bil: ${student.bil}</span>
                                    <h3 class="text-lg font-bold text-gray-900">${student.nama}</h3>
                                </div>
                                <p class="text-sm text-gray-600 mb-2">${student.kategori}</p>
                                ${statusHtml}
                            </div>
                            <div class="w-full sm:w-auto flex flex-col sm:flex-row gap-2" id="actions-${student.id}">
                                ${actionHtml}
                            </div>
                        </div>
                    `;
                });

                html += `</div></div>`;
            }

            resultsContainer.innerHTML = html;
        }

        // Helper: Generate Action Buttons
        function generateActionButtons(id, name, sekolah) {
            return `
                <button onclick="markHadir('${id}', '${name.replace(/'/g, "\\'")}', '${sekolah.replace(/'/g, "\\'")}')" class="bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded shadow font-semibold flex items-center justify-center transition duration-150">
                    <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                    HADIR
                </button>
                <button onclick="openWakilModal('${id}', '${name.replace(/'/g, "\\'")}', '${sekolah.replace(/'/g, "\\'")}')" class="bg-purple-500 hover:bg-purple-600 text-white px-4 py-2 rounded shadow font-semibold flex items-center justify-center transition duration-150">
                    WAKIL
                </button>
            `;
        }

        // Mark as Hadir (Auto-tick logic included)
        async function markHadir(id, name, sekolah) {
            const actionContainer = document.getElementById(`actions-${id}`);
            if(actionContainer) actionContainer.innerHTML = '<span class="text-gray-500 text-sm">Menyimpan...</span>';

            const currentTime = new Date().toISOString();

            try {
                // Gunakan padanan 'nama' dan 'sekolah' berbanding ID untuk fungsi auto-tick berganda
                const { error } = await supabaseClient
                    .from('recipients')
                    .update({ 
                        attendance_status: 'HADIR',
                        attendance_time: currentTime,
                        attendance_type: 'SENDIRI',
                        representative_name: null
                    })
                    .match({ nama: name, sekolah: sekolah }); // Kemaskini semua baris dengan nama dan sekolah yang sama

                if (error) throw error;
                
                // Refresh partial list silently by re-running search
                performSearch();

            } catch (error) {
                console.error("Ralat tanda hadir:", error);
                showError("Gagal mengemaskini status kehadiran.");
                performSearch(); // restore buttons
            }
        }

        // Modal Functions for Wakil
        function openWakilModal(id, name, sekolah) {
            modalRecipientId.value = id;
            modalRecipientName.textContent = name;
            modalRecipientSekolah.value = sekolah;
            wakilNameInput.value = '';
            wakilModal.classList.remove('hidden');
            wakilNameInput.focus();
        }

        function closeWakilModal() {
            wakilModal.classList.add('hidden');
        }

        async function saveWakil() {
            const nameToUpdate = modalRecipientName.textContent;
            const sekolahToUpdate = modalRecipientSekolah.value;
            const wakilName = wakilNameInput.value.trim();

            if (!wakilName) {
                alert("Sila masukkan nama wakil.");
                wakilNameInput.focus();
                return;
            }

            saveWakilBtn.disabled = true;
            saveWakilBtn.innerHTML = 'Menyimpan...';

            const currentTime = new Date().toISOString();

            try {
                // Gunakan padanan 'nama' dan 'sekolah' berbanding ID untuk fungsi auto-tick berganda
                const { error } = await supabaseClient
                    .from('recipients')
                    .update({ 
                        attendance_status: 'HADIR',
                        attendance_time: currentTime,
                        attendance_type: 'WAKIL',
                        representative_name: wakilName
                    })
                    .match({ nama: nameToUpdate, sekolah: sekolahToUpdate }); // Kemaskini semua baris berkaitan

                if (error) throw error;
                
                closeWakilModal();
                performSearch();

            } catch (error) {
                console.error("Ralat daftar wakil:", error);
                showError("Gagal merekod maklumat wakil.");
            } finally {
                saveWakilBtn.disabled = false;
                saveWakilBtn.innerHTML = 'Simpan';
            }
        }
    </script>
</body>
</html>
